<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda">
<title>Scheda Full Body A·B·C</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Barlow";src:url(fonts/Barlow-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/Barlow-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --ink:#1D2127;--muted:#5F6672;--line:#E5E7EB;--card:#F4F5F7;--bg:#FFFFFF;--danger:#B42318;
  --a:#E8590C;--a-l:#FDEBDD;--b:#0E8F80;--b-l:#DDF3F0;--c:#5B4FD6;--c-l:#E8E6FB;
  --accent:var(--a);--accent-l:var(--a-l);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:#E9EBEE;line-height:1.45;font-size:16px}
.app{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);position:relative}
[data-day="A"]{--accent:var(--a);--accent-l:var(--a-l)}
[data-day="B"]{--accent:var(--b);--accent-l:var(--b-l)}
[data-day="C"]{--accent:var(--c);--accent-l:var(--c-l)}

/* hero */
.hero{background:var(--ink);color:#fff;position:relative;padding:calc(env(safe-area-inset-top) + 26px) 22px 24px 30px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--accent)}
.hero .kicker{font:600 .82rem/1 var(--body);color:var(--accent);letter-spacing:.02em}
.hero h1{font:700 2.6rem/1 var(--display);margin:.5rem 0 .45rem;letter-spacing:.005em;max-width:72%}
.hero p{color:#C9CDD3;font-size:.95rem;max-width:30ch}
.hero .letter{position:absolute;right:18px;bottom:-14px;font:700 8.5rem/1 var(--display);color:var(--accent);pointer-events:none}

main{padding:22px 16px 8px}
.section{display:flex;align-items:center;gap:10px;margin:26px 0 12px;color:var(--muted);font:600 .8rem/1 var(--body)}
.section::after{content:"";flex:1;height:1px;background:var(--line)}
.section:first-child{margin-top:4px}
.note{color:var(--muted);font-size:.9rem;margin-top:10px}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 .75rem/1 var(--body);color:var(--muted)}
.day .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);font:600 .85rem/1 var(--body)}
.day a.dot{color:#fff;text-decoration:none;font:700 1.4rem/1 var(--display)}
.day a.dot[data-l="A"]{background:var(--a)} .day a.dot[data-l="B"]{background:var(--b)} .day a.dot[data-l="C"]{background:var(--c)}

.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.block{background:var(--card);border-radius:12px;padding:14px 8px;text-align:center}
.block b{display:block;font:700 1.9rem/1 var(--display)}
.block b.hot{color:var(--a)}
.block span{display:block;font-weight:600;font-size:.88rem;margin-top:6px}
.block small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}

.phase{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.phase.hot{background:var(--a-l)}
.phase header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.phase h3{font:600 1rem/1.2 var(--body)}
.phase em{font:700 1.2rem/1 var(--display);color:var(--a);font-style:normal}
.phase p{color:var(--muted);font-size:.9rem}
.dark{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;margin-top:14px}
.dark h3{font:600 .85rem/1 var(--body);color:var(--a);margin-bottom:8px}
.dark p{font-size:.93rem}
.dark p+h3{margin-top:14px}

/* riepilogo */
.sum{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:block;color:inherit;text-decoration:none}
.sum header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sum .badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.25rem/1 var(--display);background:var(--accent);flex:none}
.sum h3{font:600 1rem/1.1 var(--body)}
.sum header p{color:var(--muted);font-size:.82rem}
.sum ol{list-style:none;counter-reset:n}
.sum li{counter-increment:n;display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.93rem}
.sum li:first-child{border-top:0}
.sum li::before{content:counter(n) ".";color:var(--muted);width:1.4em;flex:none}
.sum li span{flex:1}
.sum li b{font:700 1rem/1.3 var(--display);color:var(--accent);white-space:nowrap}

/* exercise card */
.ex{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:16px}
.ex figure{position:relative;background:#111;aspect-ratio:3/2}
.ex img{display:block;width:100%;height:100%;object-fit:cover}
.ex .num{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 1.25rem/1 var(--display);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.ex .live{position:absolute;right:10px;bottom:10px;background:rgba(29,33,39,.78);color:#fff;font:600 .72rem/1 var(--body);padding:5px 8px;border-radius:20px}
.ex-body{padding:14px 16px 16px}
.ex h2{font:700 1.65rem/1.05 var(--display)}
.dose{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.dose strong{font:700 1.5rem/1 var(--display);color:var(--accent)}
.rec{font:600 .82rem/1 var(--body);color:var(--accent);background:var(--accent-l);border:0;border-radius:20px;padding:8px 12px 8px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.rec svg{width:14px;height:14px}
.rec:focus-visible,.nav a:focus-visible,.timer button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ex dl{display:grid;gap:10px}
.ex dt{font:600 .75rem/1 var(--body);color:var(--accent);margin-bottom:3px}
.ex dt.warn{color:var(--danger)}
.ex dd{color:var(--muted);font-size:.94rem}
.tip{background:var(--accent-l);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--ink);margin-bottom:16px}

/* rules */
.rule{display:grid;grid-template-columns:14px 1fr;gap:4px 10px;margin-bottom:12px}
.rule::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--a);margin-top:6px}
.rule b{font-weight:600}
.rule p{grid-column:2;color:var(--muted);font-size:.92rem}

footer{padding:18px 16px 0;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line);margin:12px 16px 0}
footer a{color:inherit}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font:600 .72rem/1 var(--body)}
.nav a b{font:700 1.35rem/1 var(--display);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.nav a svg{width:24px;height:24px;margin:3px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[data-l="A"][aria-current="page"] b{background:var(--a);color:#fff}
.nav a[data-l="B"][aria-current="page"] b{background:var(--b);color:#fff}
.nav a[data-l="C"][aria-current="page"] b{background:var(--c);color:#fff}

/* timer */
.timer{position:fixed;left:50%;transform:translate(-50%,120%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);width:calc(100% - 24px);max-width:536px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;z-index:20;transition:transform .25s ease,opacity .2s,visibility .25s;overflow:hidden;opacity:0;visibility:hidden}
.timer.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.timer .t{font:700 2.4rem/1 var(--display);min-width:3.2ch;font-variant-numeric:tabular-nums}
.timer .lbl{flex:1;font-size:.88rem;color:#C9CDD3}
.timer .lbl b{display:block;color:#fff;font-weight:600}
.timer button{background:#fff;color:var(--ink);border:0;border-radius:20px;padding:9px 14px;font:600 .85rem/1 var(--body);cursor:pointer}
.timer .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:100%;transform-origin:left}
.timer.done{background:var(--accent)}
.timer.done .lbl{color:#fff}


/* alternatives */
.alts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.alts span{font:600 .75rem/1.9 var(--body);color:var(--muted);margin-right:2px}
.alt{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:6px 11px;font:600 .8rem/1 var(--body);cursor:pointer}
.alt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.alt:focus-visible,.save:focus-visible,.databtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* log */
.log{margin-top:16px;padding-top:14px;border-top:1px dashed #D5D9DF}
.log h3{font:700 1.15rem/1 var(--display);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.log h3 small{font:400 .8rem/1.2 var(--body);color:var(--muted);text-align:right}
.last{font-size:.88rem;color:var(--ink);background:#fff;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.last b{font-weight:600}
.up{display:inline-block;margin-top:4px;font:600 .78rem/1 var(--body);color:#fff;background:var(--accent);border-radius:20px;padding:5px 9px}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center}
.sets .h{font:600 .72rem/1 var(--body);color:var(--muted)}
.sets label{font:600 .85rem/1 var(--body);color:var(--muted);white-space:nowrap}
.sets input{width:100%;font:600 1.15rem/1 var(--display);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);-moz-appearance:textfield}
.sets input::-webkit-outer-spin-button,.sets input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sets input:focus{outline:none;border-color:var(--accent)}
.sets.bw{grid-template-columns:auto 1fr}
.save{margin-top:12px;width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 .95rem/1 var(--body);padding:13px;cursor:pointer}
.save.ok{background:var(--accent)}
.hist{margin-top:10px;font-size:.85rem;color:var(--muted)}
.hist summary{cursor:pointer;font-weight:600}
.hist ul{list-style:none;margin-top:6px}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.hist li b{color:var(--ink);font-weight:600}

/* data */
.databtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.databtn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:12px;font:600 .9rem/1 var(--body);cursor:pointer;text-align:center}


/* cardio */
.cardio .week-badge{display:inline-block;font:600 .75rem/1 var(--body);background:var(--ink);color:#fff;border-radius:20px;padding:5px 9px;margin-left:6px;vertical-align:middle}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 1rem/1 var(--body);padding:14px;cursor:pointer;margin:4px 0 14px}
.go svg{width:18px;height:18px}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.prog{list-style:none;margin:0 0 12px;border-radius:12px;overflow:hidden;background:#fff}
.prog li{display:grid;grid-template-columns:5.5em 1fr auto auto;align-items:center;gap:8px;padding:9px 12px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line)}
.prog li:first-child{border-top:0}
.prog li b{color:var(--ink);font-weight:600}
.prog li.now{background:var(--accent-l);color:var(--ink)}
.prog li.now::after{content:"ora";font:600 .72rem/1.6 var(--body);color:#fff;background:var(--accent);border-radius:20px;padding:0 8px}
.sets.c3{grid-template-columns:1fr 1fr 1fr}
.sets.c2{grid-template-columns:1fr 1fr}


/* profilo */
.who{display:flex;gap:6px;margin:0 0 2px}
.who button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:12px;padding:11px 8px;font:600 .92rem/1 var(--body);cursor:pointer}
.who button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.who button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* bande elastiche */
.bands{list-style:none;background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:10px}
.bands li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:.92rem}
.bands li:first-child{border-top:0}
.bands i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.bands b{font-weight:600}
.bands span{color:var(--muted);font-size:.85rem}
.sets select{width:100%;font:600 1rem/1.1 var(--body);padding:9px 8px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.sets select:focus{outline:none;border-color:var(--accent)}

/* riscaldamento e defaticamento */
.wu{background:var(--card);border-radius:16px;padding:14px 16px 16px;margin-bottom:16px}
.wu h2{font:700 1.5rem/1.05 var(--display);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wu h2 span{font:600 .8rem/1 var(--body);color:var(--accent);white-space:nowrap}
.wu ol{list-style:none;counter-reset:w;margin:8px 0 14px}
.wu li{counter-increment:w;position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--line);font-size:.93rem}
.wu li:first-child{border-top:0}
.wu li::before{content:counter(w) ".";position:absolute;left:0;color:var(--muted)}
.wu li b{font-weight:600}
.wu li span{color:var(--muted)}
.wu .go{margin:0}

/* muscoli */
.mus{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.mus .body{width:112px;flex:none}
.body .sil,.body .m{fill:#D3D7DE}
.body .p{fill:var(--accent)}
.body .s{fill:var(--accent);opacity:.36}
.body text{font:600 6px var(--body);fill:#9AA0A8;text-anchor:middle}
.mus h3{font:600 .75rem/1 var(--body);color:var(--accent);margin-bottom:7px}
.mus p{font-size:.93rem;display:flex;align-items:flex-start;gap:7px;margin-bottom:4px}
.mus i{width:10px;height:10px;border-radius:3px;background:var(--accent);flex:none;margin-top:5px}
.mus .ms{color:var(--muted)}
.mus .ms i{opacity:.36}
.mus small{display:block;color:var(--muted);font-size:.8rem;margin-top:6px}

/* passo passo */
.steps{margin-top:12px}
.steps summary{font:600 .78rem/1 var(--body);color:var(--accent);cursor:pointer}
.steps summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.steps ol{margin:10px 0 0 18px;color:var(--muted);font-size:.92rem;display:grid;gap:7px}

/* note */
.note-l{font:600 .72rem/1 var(--body);color:var(--muted);display:block;margin:12px 0 6px}
.log textarea{width:100%;font:400 .95rem/1.4 var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical;display:block}
.log textarea:focus{outline:none;border-color:var(--accent)}
.qn{display:block;margin-top:6px;color:var(--muted);font-style:italic;font-size:.88rem}
.hist li .qn{margin:2px 0 0}
.hist li{flex-wrap:wrap}
.hist li .qn{flex-basis:100%}

/* pasti */
.kcal{background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.kcal .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kcal .big{font:700 3.1rem/1 var(--display);color:var(--accent)}
.kcal .big small{font:600 1rem/1 var(--body);color:#C9CDD3;margin-left:4px}
.kcal .goal{font:600 .85rem/1.3 var(--body);color:#C9CDD3;text-align:right}
.kcal .goal b{display:block;color:#fff;font:700 1.5rem/1.1 var(--display)}
.kcal .track{height:8px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}
.kcal .fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.kcal .fill.over{background:var(--danger)}
.kcal .sub{font-size:.85rem;color:#C9CDD3;margin-top:8px}
.meal{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.meal h3{font:700 1.15rem/1 var(--display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal h3 span{font:600 .85rem/1 var(--body);color:var(--accent)}
.meal ul{list-style:none;margin-top:8px}
.meal li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.meal li:first-child{border-top:0}
.meal li .nm{flex:1}
.meal li .nm em{display:block;color:var(--muted);font-style:normal;font-size:.8rem}
.meal li b{font:700 1.05rem/1 var(--display);white-space:nowrap}
.meal li button{border:0;background:none;color:var(--muted);font:700 1.3rem/1 var(--body);cursor:pointer;padding:0 2px;flex:none}
.meal .empty{color:var(--muted);font-size:.88rem;padding:6px 0}
.addf{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;gap:8px}
.addf select,.addf input{width:100%;font:600 1rem/1.1 var(--body);padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.addf input:focus,.addf select:focus{outline:none;border-color:var(--accent)}
.addf .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addf .hintf{font-size:.82rem;color:var(--muted)}
.addf button{border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 .95rem/1 var(--body);padding:13px;cursor:pointer}
.wbox{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;align-items:center}
.wbox input{width:100%;font:700 1.3rem/1 var(--display);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.wbox input:focus{outline:none;border-color:var(--accent)}
.wbox button{border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 .9rem/1 var(--body);padding:12px 16px;cursor:pointer}
.wbox p{grid-column:1/-1;color:var(--muted);font-size:.84rem;margin:0}
.fdays{list-style:none;background:var(--card);border-radius:12px;overflow:hidden}
.fdays li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:.9rem}
.fdays li:first-child{border-top:0}
.fdays li b{font:700 1.05rem/1 var(--display)}
.fdays li .w{color:var(--muted);font-size:.84rem}
.fdays li.over b{color:var(--danger)}
.copyf{width:100%;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:12px;font:600 .9rem/1 var(--body);cursor:pointer;margin-top:4px}
.copyf.ok{background:var(--ink);color:#fff}
.copyt{width:100%;margin-top:8px;font:400 .85rem/1.4 var(--body);padding:10px;border:1.5px solid var(--line);border-radius:10px;resize:vertical}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.timer{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="timer" id="timer" role="status" aria-live="polite">

  el_back_fly:["Passa l'elastico attorno a un ancoraggio solido davanti a te.","Prendi le maniglie e indietreggia finché la banda è in tensione.","Distendi le braccia davanti a te, parallele al pavimento e perpendicolari al busto, piedi larghi come le spalle. È la posizione di partenza.","Espirando, porta le braccia di lato e indietro restando distese e parallele al pavimento, fino ad averle aperte ai tuoi fianchi.","Dopo una pausa torna alla posizione iniziale inspirando."],

  leg_press:["Siediti sulla macchina e appoggia i piedi al centro della pedana, larghi come le spalle.","Sblocca le sicurezze e spingi la pedana fino a gambe distese, senza bloccare le ginocchia: busto e gambe formano un angolo di 90°. È la posizione di partenza.","Inspira e scendi lentamente finché coscia e gamba formano 90°.","Spingi soprattutto coi talloni, usando i quadricipiti, ed espira mentre risali.","A fine serie riaggancia le sicurezze prima di alzarti: non vuoi quella pedana addosso."],

  chest_db:["Sdraiati sulla panca piana coi manubri appoggiati sulle cosce, palmi che si guardano.","Aiutandoti con le cosce portali uno alla volta all'altezza delle spalle, poi ruota i polsi coi palmi in avanti: braccio e avambraccio formano 90°.","Espira e spingi in alto col petto, distendi le braccia e stringi il petto per un secondo.","Scendi lentamente: la discesa deve durare circa il doppio della spinta."],
  lat:["Siediti alla lat machine e regola il cuscino sulle cosce: serve a tenerti giù.","Impugna la barra coi palmi in avanti, mani più larghe delle spalle.","Braccia distese in alto, inclina il busto indietro di circa 30°, petto in fuori. È la posizione di partenza.","Espira e porta la barra alla parte alta del petto spingendo spalle e gomiti in basso e indietro. Il busto resta fermo, si muovono solo le braccia.","Stringi le scapole per un secondo, poi risali lentamente fino a braccia distese e dorsali in allungamento."],
  lat_under:["Siediti alla lat machine e regola il cuscino sulle cosce.","Impugna la barra coi palmi rivolti verso di te, mani più strette delle spalle.","Braccia distese, busto inclinato indietro di circa 30°, petto in fuori.","Espira e tira la barra fino alla parte alta del petto tenendo i gomiti vicini al corpo.","Dopo un secondo di contrazione risali lentamente fino a braccia distese."],
  high_row:["Regola il sedile in modo da arrivare appena alle maniglie sopra di te, e sistema il cuscino sulle ginocchia.","Impugna le maniglie coi palmi verso il basso. È la posizione di partenza.","Tira le maniglie verso il busto stringendo le scapole mentre pieghi i gomiti.","Fermati un istante in basso, poi torna su lentamente senza far toccare i pesi tra una ripetizione e l'altra."],
  shoulder:["Regola il sedile: le maniglie devono partire all'altezza della parte alta delle spalle.","Petto e testa alti, presa coi palmi in avanti.","Spingi le maniglie verso l'alto distendendo i gomiti.","Breve pausa in alto, poi torna giù fermandoti poco sopra la partenza per tenere il muscolo in tensione."],
  shoulder_db:["Seduto su una panca con schienale, appoggia i manubri in piedi sulle cosce.","Portali all'altezza delle spalle uno alla volta, poi ruota i polsi coi palmi in avanti.","Espira e spingi in alto finché i manubri quasi si toccano.","Dopo una breve pausa scendi lentamente inspirando."],
  leg_ext:["Siediti con le gambe sotto il rullo, piedi in avanti, mani sulle maniglie laterali.","Regola il rullo in modo che appoggi appena sopra i piedi e che il ginocchio formi 90°: se l'angolo è più chiuso il ginocchio va oltre le punte e l'articolazione si carica inutilmente.","Espira e distendi le gambe al massimo tenendo fermo il resto del corpo. Un secondo di pausa in alto.","Scendi lentamente inspirando, senza superare i 90°."],
  plank:["A pancia in giù, appoggia avambracci e punte dei piedi. I gomiti stanno esattamente sotto le spalle.","Tieni il corpo dritto e resta in posizione il più a lungo possibile. Per renderlo più difficile solleva un braccio o una gamba."],
  side_plank:["Sul fianco, gomito sotto la spalla e avambraccio a terra, gambe distese una sopra l'altra.","Solleva il bacino finché testa, bacino e caviglie sono in linea.","Tieni la posizione respirando normalmente, poi cambia lato."],
  row_machine:["Regola il sedile in modo che le maniglie siano all'altezza del petto.","Impugna le maniglie con presa neutra o coi palmi verso il basso.","Tira verso il busto stringendo le scapole mentre pieghi i gomiti.","Fermati un istante, poi torna lentamente senza far appoggiare i pesi."],
  row_db:["Appoggia mano e ginocchio destro sulla panca, busto piegato in avanti fino a essere parallelo al pavimento, schiena piatta.","Con la mano sinistra prendi il manubrio, palmo rivolto verso il corpo.","Tira il manubrio verso il fianco col gomito vicino al corpo, espirando. Tira con la schiena, non con le braccia: il busto resta fermo.","Scendi controllato inspirando. Finite le ripetizioni, cambia lato."],
  pulley:["Siediti al pulley coi piedi sulla pedana e le ginocchia leggermente piegate, mai bloccate.","Piegati in avanti mantenendo la schiena nella sua curva naturale e prendi la maniglia.","Con le braccia distese raddrizza il busto fino a 90° rispetto alle gambe, petto in fuori: senti i dorsali in allungamento.","Busto fermo, tira la maniglia all'addome fino a toccarlo, espirando e stringendo la schiena. Un secondo, poi torna lentamente."],
  leg_curl_seat:["Regola la macchina e siediti con la schiena contro lo schienale.","Metti la parte bassa delle gambe sopra il rullo, poco sotto i polpacci, e blocca il cuscino sulle cosce appena sopra le ginocchia. Impugna le maniglie laterali.","Espira e porta il rullo più indietro possibile piegando le ginocchia. Il busto resta fermo, un secondo di contrazione.","Torna lentamente alla partenza inspirando."],
  leg_curl_stand:["Regola la macchina, busto piegato in avanti di 30-45°, rullo dietro la gamba poco sotto il polpaccio.","Gamba distesa e mani sulle maniglie. È la posizione di partenza.","Espira e porta il tallone verso il gluteo più che puoi, senza staccare la coscia dal cuscino. Un secondo in contrazione.","Torna giù inspirando. Finite le ripetizioni, cambia gamba."],
  leg_curl:["Sdraiati a pancia in giù col rullo dietro le gambe, poco sotto i polpacci. Meglio una macchina inclinata che piatta.","Busto appoggiato, gambe distese, mani sulle maniglie.","Espira e porta i talloni verso i glutei senza staccare le cosce dal cuscino. Un secondo in contrazione.","Torna giù lentamente inspirando."],
  pec:["Siediti con la schiena piatta contro lo schienale.","Prendi le maniglie: le braccia devono stare parallele al pavimento, regola la macchina di conseguenza.","Chiudi lentamente stringendo il petto al centro, espira e tieni la contrazione un secondo.","Torna indietro lentamente inspirando, fino a sentire il petto in allungamento."],
  fly_db:["Sdraiato sulla panca piana, porta i manubri sopra il petto coi palmi che si guardano, braccia quasi distese.","Gomiti leggermente piegati e fermi: apri le braccia ad arco verso i lati finché senti tirare il petto, inspirando.","Il movimento avviene solo alla spalla, le braccia non si piegano di più.","Richiudi con lo stesso arco stringendo il petto ed espirando."],
  glute_bridge:["Sdraiato sulla schiena, braccia lungo i fianchi, ginocchia piegate e piedi larghi come le spalle.","Spingi soprattutto coi talloni e solleva il bacino tenendo la schiena dritta. Espira e tieni un secondo in alto.","Torna giù lentamente inspirando."],
  glute_bridge_1:["Sdraiato a terra, piedi appoggiati e ginocchia piegate.","Solleva una gamba portando il ginocchio verso il petto. È la posizione di partenza.","Spingi col tallone della gamba a terra ed estendi l'anca sollevando i glutei.","Sali più in alto che puoi, fermati un istante e torna giù."],
  abductor:["Siediti alla macchina e scegli un carico gestibile. Sistemate le gambe, impugna le maniglie: dalla vita in su resti fermo.","Spingi lentamente con le gambe verso l'esterno, espirando.","Senti la contrazione un secondo e torna alla partenza inspirando, sempre col busto fermo."],
  hip:["Seduto a terra con una panca dietro la schiena e il bilanciere sopra le gambe. Un cuscinetto sul bilanciere toglie quasi tutto il fastidio.","Fai rotolare il bilanciere finché è sopra le anche e appoggia la parte alta della schiena alla panca.","Spingi coi piedi ed estendi le anche verso l'alto: il peso è sostenuto da scapole e piedi.","Sali il più possibile, poi torna giù controllato."],
  pushdown:["Aggancia una barra dritta o angolata al cavo alto e impugnala coi palmi verso il basso, mani larghe come le spalle.","In piedi, busto dritto e appena inclinato in avanti, gomiti vicini al corpo e perpendicolari al pavimento.","Spingi in basso coi tricipiti fino a braccia distese, espirando. Si muovono solo gli avambracci.","Dopo un secondo risali lentamente inspirando."],
  pushdown_rope:["Aggancia la corda al cavo alto e impugnala coi palmi che si guardano.","Busto dritto e appena inclinato in avanti, gomiti vicini al corpo.","Spingi in basso portando i due capi della corda ai lati delle cosce, fino a braccia distese. Espira, gomiti fermi.","Risali lentamente inspirando."],
  deadbug:["Sdraiato sulla schiena, braccia tese verso il soffitto.","Porta piedi, ginocchia e anche a 90°.","Espira forte per abbassare le costole e schiacciare la schiena a terra, ruotando il bacino e stringendo i glutei: tieni questa posizione per tutto l'esercizio.","Distendi una gamba fino a portarla appena sopra il pavimento.","La zona lombare non si deve inarcare: se succede, fermati prima.","Riporta la gamba e alterna i lati."],
  chest_inc:["Regola il sedile: le maniglie devono partire all'altezza della parte alta del petto.","Petto e testa alti, scapole indietro.","Spingi le maniglie in avanti e in alto distendendo i gomiti.","Breve pausa, poi torna fermandoti poco sopra la partenza."],
  chest_inc_db:["Sdraiati sulla panca inclinata coi manubri sulle cosce, palmi che si guardano.","Portali all'altezza delle spalle uno alla volta, poi ruota i polsi coi palmi in avanti.","Espira e spingi in alto col petto, distendi le braccia e tieni un secondo.","Scendi lentamente: circa il doppio del tempo della spinta.","A fine serie riappoggia i manubri sulle cosce e poi a terra: è il modo più sicuro per mollarli."],
  lat_v:["Siediti alla lat machine con la maniglia a triangolo agganciata in alto.","Regola il cuscino sulle cosce.","Impugna coi palmi che si guardano, petto in fuori e busto inclinato indietro di circa 30°: così i dorsali lavorano meglio.","Tira in basso coi dorsali stringendo le scapole, fino quasi a toccare il petto. Espira, busto fermo.","Dopo un secondo torna su lentamente inspirando."],
  lateral:["In piedi, busto dritto, manubri lungo i fianchi coi palmi verso di te.","Senza slanci, sollevali di lato coi gomiti appena piegati e le mani leggermente inclinate in avanti, come se versassi dell'acqua.","Sali fino ad avere le braccia parallele al pavimento, espira e fermati un secondo.","Scendi lentamente inspirando."],
  crunch:["Carico leggero. Siediti coi piedi sotto i cuscinetti e impugna le maniglie in alto, gomiti appoggiati sui cuscini.","Chiudi il busto in avanti, ed eventualmente solleva le gambe, espirando. Lento e controllato: lavora l'addome, gambe e piedi restano rilassati.","Dopo un secondo torna lentamente alla partenza inspirando."],
  cable_crunch:["Inginocchiati sotto un cavo alto con la corda agganciata.","Abbassa la corda fino ad avere le mani ai lati della testa.","Piega leggermente le anche e lascia che il peso allunghi la zona lombare. È la posizione di partenza.","Anche ferme, chiudi il busto contraendo l'addome finché i gomiti scendono verso metà coscia. Espira e tieni un secondo.","Torna su lentamente: tensione costante sull'addome, e niente carichi così pesanti da far lavorare la schiena al posto suo."],
  pallof:["Aggancia una maniglia singola al cavo, se si può all'altezza delle spalle.","Di fianco al cavo, prendi la maniglia con due mani e allontanati fino ad avere il cavo in tensione, circa a un braccio di distanza.","Piedi larghi come le anche, ginocchia morbide, maniglia al centro del petto.","Spingi la maniglia in avanti distendendo le braccia, addome contratto.","Tieni qualche secondo, torna al petto. A fine serie giri dall'altra parte."],
  farmer:["Vanno bene due manubri pesanti, uno per mano.","Impugna e sollevali spingendo coi talloni, schiena dritta e testa alta.","Cammina a passi corti e veloci per la distanza prevista, senza trattenere il respiro."],
};

let P = PROF[PID], KEY = P.key, DAYS = P.days, DB;
function loadDB(){
  try { DB = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ DB = {}; }

}
// migrazione: i backup fatti prima dei pasti non hanno il blocco food
function normDB(){
  DB.swaps = DB.swaps || {}; DB.logs = DB.logs || {};
  DB.food = DB.food || {}; DB.food.days = DB.food.days || {}; DB.food.weights = DB.food.weights || {};
  if(DB.food.target === undefined) DB.food.target = null;
}
loadDB();
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} };
function setProfile(id){
  if(!PROF[id] || id === PID) return;

const current = (L,i) => { const sl = DAYS[L].slots[i], k = DB.swaps[`${L}:${i}`]; return (k && (k===sl.d || sl.alt.includes(k))) ? k : sl.d; };
const doseOf = (L,i,k) => EX[k].s || DAYS[L].slots[i].s;
function parseDose(s){
  const sets = parseInt(s, 10) || 3;
  const nums = (s.split("×")[1] || "").match(/\d+/g) || ["10"];
  return {sets, top:+nums[nums.length-1], low:+nums[0]};
}

const MUSC = {abdominals:"addome", abductors:"abduttori", adductors:"adduttori", biceps:"bicipiti", calves:"polpacci",

function bodySVG(p, s){
  const cl = m => p.includes(m) ? ' class="p"' : (s.includes(m) ? ' class="s"' : ' class="m"');
  const E = (x,y,rx,ry,m) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"${m?cl(m):' class="sil"'}/>`;
  const R = (x,y,w,h,r,m) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"${m?cl(m):' class="sil"'}/>`;
  const P = (d,m) => `<path d="${d}"${m?cl(m):' class="sil"'}/>`;
  const base = o => [
    E(o,13,6.6,7.6), R(o-3.4,19,6.8,12,2),
    P(`M${o-10},30 Q${o-8.2},45 ${o-7.6},52 L${o-9.4},64 H${o+9.4} L${o+7.6},52 Q${o+8.2},45 ${o+10},30 Z`),
    R(o-9.4,63,18.8,8,3),
    E(o-16,72,2.6,3), E(o+16,72,2.6,3),
    E(o-4.8,95,3.6,3.2), E(o+4.8,95,3.6,3.2),
    R(o-6.6,96,3.6,31,1.8), R(o+3,96,3.6,31,1.8),
    E(o-4.8,130,3.6,3), E(o+4.8,130,3.6,3),
  ].join("");
  const arms = (o,up) => [
    E(o-13,45,3.9,8.5,up), E(o+13,45,3.9,8.5,up),
    E(o-15,61.5,3.4,8.5,"forearms"), E(o+15,61.5,3.4,8.5,"forearms"),
  ].join("");
  const calves = o => E(o-4.8,105,3.8,8.5,"calves") + E(o+4.8,105,3.8,8.5,"calves");
  const front = o => base(o) + [
    P(`M${o-3.4},23 L${o-10},30.5 L${o-6.4},33.5 L${o-2.8},29.5 Z`,"traps"),
    P(`M${o+3.4},23 L${o+10},30.5 L${o+6.4},33.5 L${o+2.8},29.5 Z`,"traps"),
    arms(o,"biceps"),
    E(o-11.5,34.5,5.8,6.2,"shoulders"), E(o+11.5,34.5,5.8,6.2,"shoulders"),
    P(`M${o-8.6},32.5 H${o-0.9} V42 Q${o-4.8},46 ${o-8.6},42.5 Z`,"chest"),
    P(`M${o+8.6},32.5 H${o+0.9} V42 Q${o+4.8},46 ${o+8.6},42.5 Z`,"chest"),
    R(o-5.6,46,11.2,17,3,"abdominals"),
    P(`M${o-8.6},70 H${o-1} V91 Q${o-4.8},94.5 ${o-8.2},91 Z`,"quadriceps"),
    P(`M${o+8.6},70 H${o+1} V91 Q${o+4.8},94.5 ${o+8.2},91 Z`,"quadriceps"),
    calves(o),
  ].join("");
  const back = o => base(o) + [
    P(`M${o},23 L${o-9.5},30.5 L${o-5},44 H${o+5} L${o+9.5},30.5 Z`,"traps"),
    arms(o,"triceps"),
    E(o-11.5,34.5,5.8,6.2,"shoulders"), E(o+11.5,34.5,5.8,6.2,"shoulders"),
    P(`M${o-9.8},37 L${o-10.2},50 L${o-7.4},58.5 L${o-4.8},57 L${o-4.8},40.5 Z`,"lats"),
    P(`M${o+9.8},37 L${o+10.2},50 L${o+7.4},58.5 L${o+4.8},57 L${o+4.8},40.5 Z`,"lats"),
    R(o-4.5,44.5,9,11,2,"middle back"),
    R(o-5.5,56,11,7.5,2.5,"lower back"),
    E(o-9,66,2.8,4.5,"abductors"), E(o+9,66,2.8,4.5,"abductors"),
    E(o-4.6,69.5,4.8,5.2,"glutes"), E(o+4.6,69.5,4.8,5.2,"glutes"),
    P(`M${o-8.6},75 H${o-1} V91 Q${o-4.8},94.5 ${o-8.2},91 Z`,"hamstrings"),
    P(`M${o+8.6},75 H${o+1} V91 Q${o+4.8},94.5 ${o+8.2},91 Z`,"hamstrings"),
    calves(o),
  ].join("");
  return `<svg class="body" viewBox="0 0 160 146" aria-hidden="true">${front(38)}${back(120)}` +
    `<text x="38" y="143">davanti</text><text x="120" y="143">dietro</text></svg>`;

/* ---------- registro ---------- */
function lastEntry(k){
  const all = DB.logs[k] || [];
  const past = all.filter(e => e.d !== today());
  return {prev: past[past.length-1], todayE: all.find(e => e.d === today()), all};
}
function setsText(e, bw, band){
  if(!e) return "";
  const done = e.sets.filter(x => x.r || x.kg);
  if(bw) return done.map(x => x.r).join(" · ") + (bw==="sec" ? " sec" : " rip");
  if(band){
    const bs = done.map(x => x.b ? bandOf(x.b).n.toLowerCase() : "–"), reps = done.map(x => x.r ?? "–");
    return bs.every(v => v === bs[0]) ? `${bs[0]} × ${reps.join(" · ")}` : bs.map((b, i) => `${b} × ${reps[i]}`).join(" · ");
  }
  const kgs = done.map(x => x.kg ?? "–"), reps = done.map(x => x.r ?? "–");
  return kgs.every(v => v === kgs[0]) ? `${kgs[0]} kg × ${reps.join(" · ")}` : `${kgs.join(" · ")} kg × ${reps.join(" · ")}`;
}
function logBlock(L, i, k){
  const ex = EX[k], bw = ex.bw, band = ex.band, dose = parseDose(doseOf(L,i,k));
  const {prev, todayE, all} = lastEntry(k);
  const base = todayE || null;
  let hint = "";
  if(prev){
    const done = prev.sets.filter(x => x.r);
    const hit = done.length >= dose.sets && done.every(x => x.r >= dose.top);
    const nb = band ? nextBand(done[done.length-1]?.b) : null;
    const up = bw ? "Aumenta di qualche ripetizione o secondo"
      : band ? (nb ? `Oggi prova la banda ${nb.n.toLowerCase()}` : "Banda più forte che hai: rallenta il ritorno e tieni 2 secondi in contrazione")
      : "Oggi sali di uno step";
    hint = `<div class="last"><b>Ultima volta</b>, ${niceDate(prev.d)}: ${esc(setsText(prev, bw, band)) || "nessuna serie registrata"}` +
      (hit ? `<br><span class="up">${up}</span>` : "") +
      (prev.note ? `<i class="qn">«${esc(prev.note)}»</i>` : "") + `</div>`;
  } else {
    hint = bw ? `<div class="last">Prima volta: segna ${bw==="sec"?"quanti secondi tieni":"quante ripetizioni fai"} per ogni serie.</div>`
      : band ? `<div class="last">Prima volta: parti dalla banda <b>${bandOf(ex.b0).n.toLowerCase()}</b> e arriva a ${dose.low} ripetizioni faticose ma pulite. Se è troppo facile o troppo dura, cambia colore e segna quello che hai usato.</div>`
      : `<div class="last">Prima volta: trova il peso con cui arrivi a ${dose.low} ripetizioni faticose ma pulite.</div>`;
  }
  const rows = Array.from({length: dose.sets}, (_, s) => {
    const cur = base?.sets[s] || {}, old = prev?.sets[s] || {};
    const load = bw ? ""
      : band ? `<select name="b${s}" aria-label="Serie ${s+1}, banda">${BANDS.map(b => `<option value="${b.k}"${(cur.b ?? old.b ?? ex.b0) === b.k ? " selected" : ""}>${b.n}</option>`).join("")}</select>`
      : `<input type="number" inputmode="decimal" step="0.5" min="0" name="kg${s}" aria-label="Serie ${s+1}, chili" placeholder="${old.kg ?? "kg"}" value="${cur.kg ?? ""}">`;
    return `<label for="r-${L}${i}-${s}">Serie ${s+1}</label>${load}<input id="r-${L}${i}-${s}" type="number" inputmode="numeric" min="0" name="r${s}" aria-label="Serie ${s+1}, ${bw==="sec"?"secondi":"ripetizioni"}" placeholder="${old.r ?? (bw==="sec"?"sec":"rip")}" value="${cur.r ?? ""}">`;
  }).join("");
  const head = bw ? `<span></span><span class="h">${bw==="sec"?"Secondi":"Ripetizioni"}</span>` : `<span></span><span class="h">${band ? "Banda" : "Kg"}</span><span class="h">Ripetizioni</span>`;
  const hist = all.length ? `<details class="hist"><summary>Storico (${all.length})</summary><ul>${all.slice(-8).reverse().map(e => `<li><span>${niceDate(e.d)}</span><b>${esc(setsText(e,bw,band))}</b>${e.note ? `<i class="qn">«${esc(e.note)}»</i>` : ""}</li>`).join("")}</ul></details>` : "";
  return `<form class="log" data-k="${k}" data-bw="${bw||""}" data-band="${band?"1":""}">
    <h3>Il tuo registro <small>${todayE ? "Salvato oggi" : "I valori grigi sono quelli dell'ultima volta"}</small></h3>
    ${hint}
    <div class="sets${bw?" bw":""}">${head}${rows}</div>
    <label class="note-l" for="nt-${L}${i}">Note: dolori, sensazioni, regolazioni della macchina</label>
    <textarea id="nt-${L}${i}" name="note" rows="2" placeholder="Es. fastidio al ginocchio destro nelle ultime 2 ripetizioni">${esc(base?.note || "")}</textarea>
    <button class="save" type="submit">${todayE ? "Aggiorna la sessione di oggi" : "Salva la sessione di oggi"}</button>
    ${hist}
  </form>`;
}

function planWeek(){
  const dates = Object.values(DB.logs).flat().map(e => e.d).sort();
  if(!dates.length) return 1;
  const days = Math.floor((new Date(today()+"T12:00") - new Date(dates[0]+"T12:00")) / 86400000);
  return Math.floor(days / 7) + 1;
}

      </div>

    </form>
    <datalist id="foodlist">${FOOD.map(f => `<option value="${esc(f[0])}">`).join("")}</datalist>

    <h2 class="section">Peso di stamattina</h2>

app.addEventListener("submit", e => {
  if(e.target.id === "addf"){
    e.preventDefault();
    const f = e.target, n = f.n.value.trim(), kcal = Math.round(+f.kcal.value);
    if(!n || !(kcal >= 0)) return;
    const item = {m:f.m.value, n, kcal};
    if(f.g.value !== "") item.g = +f.g.value;
    (DB.food.days[today()] = DB.food.days[today()] || []).push(item);
    persist(); render(true);
    document.querySelector("#addf [name=n]")?.focus({preventScroll:true});
    return;
  }
  if(e.target.id === "wform"){
    e.preventDefault();
    const v = e.target.w.value;
    if(v === "") delete DB.food.weights[today()]; else DB.food.weights[today()] = +v;
    persist(); render(true); return;
  }
  if(e.target.id === "tform"){
    e.preventDefault();
    const v = e.target.t.value;
    DB.food.target = v === "" ? null : Math.round(+v);
    persist(); render(true); return;
  }
  const f = e.target.closest("form.log"); if(!f) return;
  e.preventDefault();
  if(f.classList.contains("cardio")){
    const entry = {d:today()};
    f.querySelectorAll("input").forEach(inp => {
      const v = inp.value !== "" ? inp.value : (isNaN(+inp.placeholder) ? "" : inp.placeholder);
      if(v !== "") entry[inp.name] = +v;
    });
    const cnote = f.querySelector("textarea").value.trim();
    if(cnote) entry.note = cnote;
    if(!entry.min && !entry.note){ f.querySelector("input").focus(); return; }
    const list = DB.logs[f.dataset.k] = DB.logs[f.dataset.k] || [];
    const idx = list.findIndex(x => x.d === today());
    if(idx >= 0) list[idx] = entry; else list.push(entry);
    persist();
    const btn = f.querySelector(".save"); btn.textContent = "Salvato"; btn.classList.add("ok");
    setTimeout(() => render(true), 900);
    return;
  }
  const k = f.dataset.k, bw = f.dataset.bw, band = f.dataset.band, rows = f.querySelectorAll(`input[name^="r"]`);
  const sets = [...rows].map((r, s) => {
    const reps = r.value !== "" ? +r.value : null;
    if(bw) return {r:reps};
    if(band){ const sel = f.querySelector(`select[name="b${s}"]`); return {b: sel ? sel.value : null, r:reps}; }
    const kgEl = f.querySelector(`input[name="kg${s}"]`);
    const kg = kgEl && kgEl.value !== "" ? +kgEl.value : (kgEl && kgEl.placeholder !== "kg" && r.value !== "" ? +kgEl.placeholder : null);
    return {kg, r:reps};
  });
  const note = f.querySelector("textarea").value.trim();
  if(!sets.some(x => x.r || x.kg) && !note){ f.querySelector("input").focus(); return; }

  const list = DB.logs[k] = DB.logs[k] || [];
  const idx = list.findIndex(x => x.d === today());
  const entry = {d:today(), sets};
  if(note) entry.note = note;
  if(idx >= 0) list[idx] = entry; else list.push(entry);
  persist();
  const btn = f.querySelector(".save"); btn.textContent = "Salvato"; btn.classList.add("ok");
  setTimeout(() => render(true), 900);
});

/* ---------- timer di recupero ---------- */
const T = {el:document.getElementById("timer"), val:document.getElementById("tval"), name:document.getElementById("tname"),
  sub:document.getElementById("tsub"), bar:document.getElementById("tbar"), id:null, end:0, total:0};
let actx;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t => { const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880;
      g.gain.setValueAtTime(0.25, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+t+0.18);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.2); });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,300]);
}
function tick(){
  const left = Math.max(0, Math.round((T.end - Date.now())/1000));
  T.val.textContent = clock(left);
  T.bar.style.transform = `scaleX(${left / T.total})`;
  if(left === 0){
    clearInterval(T.id); T.id = null;
    T.el.classList.add("done"); T.sub.textContent = "Vai con la prossima serie"; T.name.textContent = "Recupero finito";
    beep(); setTimeout(stop, 6000);
  }
}
function start(sec, name){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){}
  clearInterval(T.id);
  T.total = sec; T.end = Date.now() + sec*1000;
  T.el.classList.remove("done");
  T.name.textContent = name; T.sub.textContent = "Recupero in corso";
  T.el.style.setProperty("--accent", getComputedStyle(document.querySelector("#app [data-day]")).getPropertyValue("--accent"));
  T.el.classList.add("on"); tick(); T.id = setInterval(tick, 250);
}
function stop(){ clearInterval(T.id); T.id=null; T.el.classList.remove("on","done"); }
document.getElementById("tstop").addEventListener("click", stop);

/* ---------- offline ---------- */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js");
}
</script>
